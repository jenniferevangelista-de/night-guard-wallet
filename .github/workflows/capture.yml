# Records the real answers of the app (devnet + Gemma) for the interactive web replay in docs/demo.
name: capture

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NGW_SEED: ${{ secrets.NGW_SEED }}
      OLLAMA_MODELS: /home/runner/.ollama-models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.config/ngw/demo
          key: ngw-demo-v2
      - uses: actions/cache@v4
        with:
          path: /home/runner/.ollama-models
          key: ollama-gemma4-e2b-v1
      - name: Solana CLI (only to grind the look-alike wallet once)
        run: |
          if [ ! -f ~/.config/ngw/demo/lookalike.json ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
            echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          fi
      - name: Ollama + Gemma 4 E2B
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          OLLAMA_MODELS=$OLLAMA_MODELS OLLAMA_KEEP_ALIVE=60m nohup ollama serve > /tmp/ollama.log 2>&1 &
          sleep 5
          ollama pull gemma4:e2b
      - name: Capture the real answers
        working-directory: app
        run: |
          npm ci
          npx tsx src/reclaim.ts || true
          npx tsx src/setup.ts | grep -E "topped|cancelled|elder wallet"
          nohup npx tsx src/server.ts > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8787/api/state > /dev/null && break; sleep 2; done
          npx tsx src/capture_replay.ts
      - uses: actions/upload-artifact@v4
        with:
          name: replay-data
          retention-days: 7
          path: docs/demo/data
